      NATIVE_IVF_RESCORE_BOUNDS: "${NATIVE_IVF_RESCORE_BOUNDS:-1}"
      NATIVE_IVF_RESCORE_SPECIALIZED: "${NATIVE_IVF_RESCORE_SPECIALIZED:-1}"
      NATIVE_IVF_RESCORE_RADIUS_PROBES: "${NATIVE_IVF_RESCORE_RADIUS_PROBES:-0}"
      NATIVE_IVF_RESCORE_TAIL_SELECT: "${NATIVE_IVF_RESCORE_TAIL_SELECT:-0}"
      NATIVE_IVF_CENTROID_PREFILTER: "${NATIVE_IVF_CENTROID_PREFILTER:-1}"
      NATIVE_IVF_CENTROID_PREFILTER_DIMS: "${NATIVE_IVF_CENTROID_PREFILTER_DIMS:-6}"
      NATIVE_IVF_CENTROID_PREFILTER_TARGET: "${NATIVE_IVF_CENTROID_PREFILTER_TARGET:-28}"
      NATIVE_IVF_CENTROID_DOT: "${NATIVE_IVF_CENTROID_DOT:-0}"
      NATIVE_IVF_CENTROID_GRAPH: "${NATIVE_IVF_CENTROID_GRAPH:-0}"
      NATIVE_IVF_CENTROID_GRAPH_NEIGHBORS: "${NATIVE_IVF_CENTROID_GRAPH_NEIGHBORS:-16}"
      NATIVE_IVF_CENTROID_GRAPH_SEEDS: "${NATIVE_IVF_CENTROID_GRAPH_SEEDS:-8}"
      NATIVE_IVF_CENTROID_GRAPH_MAX_PROBE: "${NATIVE_IVF_CENTROID_GRAPH_MAX_PROBE:-28}"
      NATIVE_CONTROL_RCVBUF: "${NATIVE_CONTROL_RCVBUF:-65536}"
      NATIVE_CONTROL_SNDBUF: "${NATIVE_CONTROL_SNDBUF:-65536}"
      NATIVE_SKIP_FD_NONBLOCKING: "${NATIVE_SKIP_FD_NONBLOCKING:-1}"
      NATIVE_AGGRESSIVE_COMPACT: "${NATIVE_AGGRESSIVE_COMPACT:-1}"
      NATIVE_FRAGMENT_PROFILE: "${NATIVE_FRAGMENT_PROFILE:-0}"
      NATIVE_INDEX_PATH: service/index.bin
      FD_CONTROL_SOCKET: /sockets/fd-service-1.sock
    volumes:
      - sockets-volume:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-0.33}"
          memory: "${SERVICE_MEMORY:-167M}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
      core: 0

  service-2:
    image: ${API_IMAGE:-joycegodinhoo/rinha-2026-api:v0.2.56-haswell-ofast}
    platform: linux/amd64
    environment:
      GC_MODE: off
      GOGC: "500"
      GOMEMLIMIT: "60MiB"
      VECTOR_MODE: native
      NATIVE_IVF_MODE: cpp
      NATIVE_PROFILE: "${NATIVE_PROFILE:-0}"
      NATIVE_IVF_TRACE: "${NATIVE_IVF_TRACE:-0}"
      NATIVE_IVF_RADIUS_SCAN: "${NATIVE_IVF_RADIUS_SCAN:-0}"
      NATIVE_IVF_DYNAMIC_BOUNDS: "${NATIVE_IVF_DYNAMIC_BOUNDS:-1}"
      NATIVE_IVF_BLOCK_BBOX: "${NATIVE_IVF_BLOCK_BBOX:-0}"
      NATIVE_IVF_QUICK_BBOX: "${NATIVE_IVF_QUICK_BBOX:-0}"
      NATIVE_IVF_RESCORE_BBOX: "${NATIVE_IVF_RESCORE_BBOX:-0}"
      NATIVE_IVF_BBOX_DIMS: "${NATIVE_IVF_BBOX_DIMS:-8}"
      NATIVE_IVF_QUICK_HOT_BBOX: "${NATIVE_IVF_QUICK_HOT_BBOX:-0}"
      NATIVE_IVF_RESCORE_HOT_BBOX: "${NATIVE_IVF_RESCORE_HOT_BBOX:-0}"
      NATIVE_IVF_HOT_BBOX_DIMS: "${NATIVE_IVF_HOT_BBOX_DIMS:-6}"
      NATIVE_IVF_QUICK_CENTER_BOUND: "${NATIVE_IVF_QUICK_CENTER_BOUND:-0}"
      NATIVE_IVF_RESCORE_CENTER_BOUND: "${NATIVE_IVF_RESCORE_CENTER_BOUND:-0}"
      NATIVE_IVF_BLOCK_CENTER_DIMS: "${NATIVE_IVF_BLOCK_CENTER_DIMS:-6}"
      NATIVE_IVF_CENTER_BOUND_MIN_FROM: "${NATIVE_IVF_CENTER_BOUND_MIN_FROM:-28}"
      NATIVE_IVF_DIM_ORDER: "${NATIVE_IVF_DIM_ORDER:-}"
      NATIVE_IVF_QUICK_PROBE: "${NATIVE_IVF_QUICK_PROBE:-8}"
      NATIVE_IVF_EXPANDED_PROBE: "${NATIVE_IVF_EXPANDED_PROBE:-129}"
      NATIVE_IVF_RESCUE5_PROBE: "${NATIVE_IVF_RESCUE5_PROBE:-28}"
      NATIVE_IVF_RESCUE_MIN: "${NATIVE_IVF_RESCUE_MIN:-2}"
      NATIVE_IVF_RESCUE_MAX: "${NATIVE_IVF_RESCUE_MAX:-5}"
      NATIVE_IVF_RESCUE2_MIN_WORST: "${NATIVE_IVF_RESCUE2_MIN_WORST:-0}"
      NATIVE_IVF_RESCUE3_MIN_WORST: "${NATIVE_IVF_RESCUE3_MIN_WORST:-0}"
      NATIVE_IVF_RESCUE4_MIN_WORST: "${NATIVE_IVF_RESCUE4_MIN_WORST:-1.0}"
      NATIVE_IVF_RESCUE5_MIN_WORST: "${NATIVE_IVF_RESCUE5_MIN_WORST:-0.9993}"
      NATIVE_IVF_RESCUE5_MIN_CENTROID_GAP: "${NATIVE_IVF_RESCUE5_MIN_CENTROID_GAP:-1.014}"
      NATIVE_IVF_RESCUE5_MIN_LAST_CENTROID_GAP: "${NATIVE_IVF_RESCUE5_MIN_LAST_CENTROID_GAP:-1.0068}"
      NATIVE_IVF_RESCUE5_MAX_CENTROID_GAP: "${NATIVE_IVF_RESCUE5_MAX_CENTROID_GAP:-1.0083}"
      NATIVE_IVF_RESCUE5_MAX_LAST_CENTROID_GAP: "${NATIVE_IVF_RESCUE5_MAX_LAST_CENTROID_GAP:-0}"
      NATIVE_IVF_RESCUE5_MAX_BEST: "${NATIVE_IVF_RESCUE5_MAX_BEST:-0}"
      NATIVE_IVF_RESCUE234_TWO_PHASE: "${NATIVE_IVF_RESCUE234_TWO_PHASE:-0}"
      NATIVE_IVF_RESCUE234_PROBE: "${NATIVE_IVF_RESCUE234_PROBE:-28}"
      NATIVE_IVF_RESCUE234_SECOND_MIN: "${NATIVE_IVF_RESCUE234_SECOND_MIN:-1}"
      NATIVE_IVF_RESCUE234_SECOND_MAX: "${NATIVE_IVF_RESCUE234_SECOND_MAX:-4}"
      NATIVE_IVF_RESCUE2_MIN_MARGIN: "${NATIVE_IVF_RESCUE2_MIN_MARGIN:-0.000001}"
      NATIVE_IVF_RESCUE3_MIN_MARGIN: "${NATIVE_IVF_RESCUE3_MIN_MARGIN:-0.000001}"
      NATIVE_IVF_RESCUE4_MIN_MARGIN: "${NATIVE_IVF_RESCUE4_MIN_MARGIN:-0}"
      NATIVE_IVF_SECOND_CHANCE_PROBE: "${NATIVE_IVF_SECOND_CHANCE_PROBE:-96}"
      NATIVE_IVF_SECOND_CHANCE_MIN: "${NATIVE_IVF_SECOND_CHANCE_MIN:-3}"
      NATIVE_IVF_SECOND_CHANCE_MAX: "${NATIVE_IVF_SECOND_CHANCE_MAX:-4}"
      NATIVE_IVF_SECOND_CHANCE3_MIN_WORST: "${NATIVE_IVF_SECOND_CHANCE3_MIN_WORST:-0}"
      NATIVE_IVF_SECOND_CHANCE4_MAX_WORST: "${NATIVE_IVF_SECOND_CHANCE4_MAX_WORST:-0}"
      NATIVE_IVF_RESCORE_QUANTIZED: "${NATIVE_IVF_RESCORE_QUANTIZED:-1}"
      NATIVE_IVF_RESCORE_BOUNDS: "${NATIVE_IVF_RESCORE_BOUNDS:-1}"
      NATIVE_IVF_RESCORE_SPECIALIZED: "${NATIVE_IVF_RESCORE_SPECIALIZED:-1}"
      NATIVE_IVF_RESCORE_RADIUS_PROBES: "${NATIVE_IVF_RESCORE_RADIUS_PROBES:-0}"
      NATIVE_IVF_RESCORE_TAIL_SELECT: "${NATIVE_IVF_RESCORE_TAIL_SELECT:-0}"
      NATIVE_IVF_CENTROID_PREFILTER: "${NATIVE_IVF_CENTROID_PREFILTER:-1}"
      NATIVE_IVF_CENTROID_PREFILTER_DIMS: "${NATIVE_IVF_CENTROID_PREFILTER_DIMS:-6}"
      NATIVE_IVF_CENTROID_PREFILTER_TARGET: "${NATIVE_IVF_CENTROID_PREFILTER_TARGET:-28}"
      NATIVE_IVF_CENTROID_DOT: "${NATIVE_IVF_CENTROID_DOT:-0}"
      NATIVE_IVF_CENTROID_GRAPH: "${NATIVE_IVF_CENTROID_GRAPH:-0}"
      NATIVE_IVF_CENTROID_GRAPH_NEIGHBORS: "${NATIVE_IVF_CENTROID_GRAPH_NEIGHBORS:-16}"
      NATIVE_IVF_CENTROID_GRAPH_SEEDS: "${NATIVE_IVF_CENTROID_GRAPH_SEEDS:-8}"
      NATIVE_IVF_CENTROID_GRAPH_MAX_PROBE: "${NATIVE_IVF_CENTROID_GRAPH_MAX_PROBE:-28}"
      NATIVE_CONTROL_RCVBUF: "${NATIVE_CONTROL_RCVBUF:-65536}"
      NATIVE_CONTROL_SNDBUF: "${NATIVE_CONTROL_SNDBUF:-65536}"
      NATIVE_SKIP_FD_NONBLOCKING: "${NATIVE_SKIP_FD_NONBLOCKING:-1}"
      NATIVE_AGGRESSIVE_COMPACT: "${NATIVE_AGGRESSIVE_COMPACT:-1}"
      NATIVE_FRAGMENT_PROFILE: "${NATIVE_FRAGMENT_PROFILE:-0}"
      NATIVE_INDEX_PATH: service/index.bin
      FD_CONTROL_SOCKET: /sockets/fd-service-2.sock
    volumes:
      - sockets-volume:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-0.33}"
          memory: "${SERVICE_MEMORY:-167M}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
      core: 0

  load-balancer:
    image: ${LB_IMAGE:-joycegodinhoo/rinha-2026-lb:v0.2.14-haswell-ofast}
    platform: linux/amd64
    ports:
      - "9999:9999"
    depends_on:
      - service-1
      - service-2
    environment:
      FD_LB_ADDR: 0.0.0.0:9999
      FD_TARGET_1: /sockets/fd-service-1.sock
      FD_TARGET_2: /sockets/fd-service-2.sock
      FD_LB_WORKERS: "1"
      FD_LB_REUSEPORT: "0"
      FD_LB_LOCAL_RR: "0"
      FD_LB_DEFER_ACCEPT_SECONDS: "1"
      FD_LB_CONNECT_RETRIES: "3000"
      FD_LB_RECONNECT_RETRIES: "3"
      FD_LB_CONNECT_SLEEP_MS: "10"
      FD_LB_TCP_RCVBUF: "${FD_LB_TCP_RCVBUF:-0}"
      FD_LB_TCP_SNDBUF: "${FD_LB_TCP_SNDBUF:-0}"
      FD_LB_CONTROL_RCVBUF: "${FD_LB_CONTROL_RCVBUF:-65536}"
      FD_LB_CONTROL_SNDBUF: "${FD_LB_CONTROL_SNDBUF:-65536}"
      FD_LB_SET_ACCEPT_NODELAY: "${FD_LB_SET_ACCEPT_NODELAY:-0}"
    volumes:
      - sockets-volume:/sockets
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${LB_CPUS:-0.30}"
          memory: "${LB_MEMORY:-10M}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
      core: 0

  warmup:
    image: curlimages/curl:8.8.0
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/warmup.sh"]
    environment:
      - BASE_URL=http://load-balancer:9999
      - READY_RETRIES=240
      - READY_SLEEP=0.25
      - WARMUP_ROUNDS=48
    volumes:
      - ./scripts/warmup.sh:/warmup.sh:ro
    depends_on:
      - load-balancer
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${WARMUP_CPUS:-0.04}"
          memory: "${WARMUP_MEMORY:-6M}"
    restart: "no"

networks:
  backend:
    driver: bridge

volumes:
  sockets-volume:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
